[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "find-my-job"
version = "0.1.0"
description = "Local multi-agent CLI to filter Indian job openings and generate cover letters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-google-genai>=2.0.0",
  "langchain-chroma>=0.1.4",
  "langchain-community>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "chromadb>=0.5.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "docx2txt>=0.8",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
find-my-job = "find_my_job.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/find_my_job"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.uv]
dev-dependencies = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]
